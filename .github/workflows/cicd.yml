name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'tests/**.py'
      - 'params.yaml'
      - 'requirements.txt'
      - '.dvc/config'
      - '.github/workflows/cicd.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: income-model-deploy
  cancel-in-progress: false

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: sqlite:///${{ runner.temp }}/mlflow-test.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest tests/ -v

  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: sqlite:///${{ runner.temp }}/mlflow-train.db
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies with S3 support
        run: python -m pip install -r requirements.txt "dvc[s3]==3.50.1"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Pull data with DVC
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc
      - name: Train model
        run: python src/train.py
      - name: Read report
        id: read_report
        run: |
          python - <<'PYEOF'
          import json
          import os
          with open("outputs/report.json") as report:
              f1 = json.load(report)["f1_score"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"f1={f1}\n")
          PYEOF
      - name: Save model for release
        uses: actions/upload-artifact@v4
        with:
          name: model
          path: models/model.joblib
          if-no-files-found: error
      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json
          if-no-files-found: error

  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Check quality gate
        env:
          F1: ${{ needs.train.outputs.f1 }}
        run: |
          python - <<'PYEOF'
          import math
          import os
          f1 = float(os.environ["F1"])
          if not math.isfinite(f1) or not 0.65 <= f1 <= 1.0:
              raise SystemExit(f"FAILED: f1_score {f1:.4f} khong dat nguong [0.65, 1.0]. Huy trien khai.")
          print(f"PASSED: f1_score {f1:.4f} >= 0.65. Dang trien khai model.")
          PYEOF

  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: model
          path: models
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
      # Chi cap nhat model hien tai sau khi Quality Gate thanh cong.
      - name: Upload approved model to S3
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: aws s3 cp models/model.joblib "s3://${ARTIFACT_BUCKET}/artifacts/current/model.joblib"
      # EC2 can quyen doc S3 va ARTIFACT_BUCKET trong service income-api.
      # serve.py tu tai model moi khi service khoi dong.
      - name: SSH deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -eu
            sudo systemctl restart income-api
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error --max-time 5 http://localhost:8080/healthz; then
                echo "Health check passed."
                exit 0
              fi
              sleep 5
            done
            echo "Health check failed."
            exit 1
